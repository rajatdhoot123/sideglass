name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The frida prebuild is only needed to compile the unpinning agent. Tests skip that when it is absent.
      - run: node node_modules/frida/scripts/install.js || true
      - run: pnpm test
      - run: pnpm exec tsc -p . --noEmit
      - run: pnpm build
